worker_processes auto;

events {
    worker_connections 1024;
}

http {

    map $remote_addr $forwarded_for {
        ~: "\"[$remote_addr]:$remote_port\"";
        default "\"$remote_addr:$remote_port\"";
    }

    map $server_addr $forwarded_by {
        ~:  "\"[$server_addr]:$server_port\"";
        default "\"$server_addr:$server_port\"";
    }

    server {
        listen 443 ssl;
        server_name api.example.com;

        ssl_certificate     /etc/nginx/certs/api.example.com.crt;
        ssl_certificate_key /etc/nginx/certs/api.example.com.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        location /myapp/ {
            proxy_pass http://backend-app:8081/;

            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Prefix /myapp;

            proxy_set_header Forwarded "for=$forwarded_for;by=$forwarded_by;host=$host;proto=$scheme";

            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}
