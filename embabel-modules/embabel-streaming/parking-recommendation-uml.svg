<svg width="720" height="440" viewBox="0 0 720 440" xmlns="http://www.w3.org/2000/svg"
     font-family="ui-monospace, 'Cascadia Code', monospace">

  <!-- Background -->
  <rect width="720" height="440" fill="#f8f9ff"/>

  <!-- ── ParkingRecommendation ── -->
  <!-- Header -->
  <rect x="40" y="60" width="290" height="50" fill="#1d2c5e" rx="4"/>
  <rect x="40" y="82" width="290" height="28" fill="#1d2c5e"/>
  <text x="185" y="78" text-anchor="middle" fill="#9ab4ee" font-size="11" font-style="italic">«record»</text>
  <text x="185" y="98" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">ParkingRecommendation</text>
  <!-- Body -->
  <rect x="40" y="110" width="290" height="108" fill="#eef1fb" stroke="#2d4a8f" stroke-width="1.5"/>
  <line x1="40" y1="110" x2="330" y2="110" stroke="#2d4a8f" stroke-width="1.5"/>
  <text x="55" y="131" fill="#1e2130" font-size="11">+ scenario : String</text>
  <text x="55" y="153" fill="#1e2130" font-size="11">+ chosenOption : Option</text>
  <text x="55" y="175" fill="#1e2130" font-size="11">+ estimatedTotalCost : int</text>
  <text x="55" y="197" fill="#1e2130" font-size="11">+ summary : String</text>
  <!-- Outer border -->
  <rect x="40" y="60" width="290" height="158" fill="none" stroke="#2d4a8f" stroke-width="1.5" rx="4"/>

  <!-- ── Option ── -->
  <!-- Header -->
  <rect x="420" y="60" width="240" height="50" fill="#1d2c5e" rx="4"/>
  <rect x="420" y="82" width="240" height="28" fill="#1d2c5e"/>
  <text x="540" y="78" text-anchor="middle" fill="#9ab4ee" font-size="11" font-style="italic">«enumeration»</text>
  <text x="540" y="98" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">Option</text>
  <!-- Body -->
  <rect x="420" y="110" width="240" height="80" fill="#eef1fb" stroke="#2d4a8f" stroke-width="1.5"/>
  <line x1="420" y1="110" x2="660" y2="110" stroke="#2d4a8f" stroke-width="1.5"/>
  <text x="435" y="131" fill="#1e2130" font-size="11">STREET</text>
  <text x="435" y="153" fill="#1e2130" font-size="11">METER</text>
  <text x="435" y="175" fill="#1e2130" font-size="11">GARAGE</text>
  <!-- Outer border -->
  <rect x="420" y="60" width="240" height="130" fill="none" stroke="#2d4a8f" stroke-width="1.5" rx="4"/>

  <!-- ── ParkingTooling ── -->
  <!-- Header (no stereotype) -->
  <rect x="40" y="290" width="290" height="34" fill="#1d2c5e" rx="4"/>
  <rect x="40" y="306" width="290" height="18" fill="#1d2c5e"/>
  <text x="185" y="312" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">ParkingTooling</text>
  <!-- Body -->
  <rect x="40" y="324" width="290" height="90" fill="#eef1fb" stroke="#2d4a8f" stroke-width="1.5"/>
  <line x1="40" y1="324" x2="330" y2="324" stroke="#2d4a8f" stroke-width="1.5"/>
  <text x="55" y="345" fill="#1e2130" font-size="11">+ findStreetParking(loc, maxMin) : String</text>
  <text x="55" y="367" fill="#1e2130" font-size="11">+ findMeterParking(loc, maxMin) : String</text>
  <text x="55" y="389" fill="#1e2130" font-size="11">+ reserveGarage(loc) : String</text>
  <!-- Outer border -->
  <rect x="40" y="290" width="290" height="124" fill="none" stroke="#2d4a8f" stroke-width="1.5" rx="4"/>

  <!-- ── Arrow: ParkingRecommendation ──► Option (association) ── -->
  <line x1="330" y1="138" x2="420" y2="138" stroke="#2d4a8f" stroke-width="1.5"/>
  <polyline points="413,132 420,138 413,144" fill="none" stroke="#2d4a8f" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="375" y="129" text-anchor="middle" fill="#4a7fe0" font-size="10">chosenOption</text>


</svg>
